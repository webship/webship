version: 2.1

defaults: &defaults
  docker:
    - image: cimg/base:current
    - image: cimg/mysql:8.0
      entrypoint:
        [
          "docker-entrypoint.sh",
          "--default-authentication-plugin=mysql_native_password",
        ]
      environment:
        MYSQL_ROOT_PASSWORD: rootpw
        MYSQL_ROOT_HOST: "%"
        MYSQL_DATABASE: test_webship
        MYSQL_USER: user
        MYSQL_PASSWORD: passw0rd
  resource_class: large

commands:
  webship-build:
    steps:
      - checkout

      # Minimal system dependencies
      - run:
          name: Minimal system setup
          command: |
            sudo apt update
            sudo apt install -y curl git unzip ca-certificates gnupg2 mysql-client

      # Setup Apache2 and PHP8.3
      - run:
          name: Setup Apache2 and PHP8.3
          command: |
            sudo add-apt-repository ppa:ondrej/php -y
            sudo apt update
            sudo apt install -y apache2 php8.3 libapache2-mod-php8.3 \
              php8.3-mbstring php8.3-mysql php8.3-xml php8.3-curl \
              php8.3-gd php8.3-intl php8.3-zip php8.3-bcmath php-pear

            sudo a2enmod php8.3 headers rewrite env mime expires ssl
            sudo update-alternatives --set php /usr/bin/php8.3
            {
              echo "memory_limit = -1"
              echo "max_execution_time = 1200"
              echo "error_reporting = E_ALL"
              echo "max_input_time = 180"
              echo "max_input_vars = 10000"
              echo "post_max_size = 64M"
              echo "upload_max_filesize = 32M"
              echo "max_file_uploads = 40"
            } | sudo tee -a /etc/php/8.3/apache2/php.ini > /dev/null
            sudo service apache2 restart

      # Wait for MySQL
      - run:
          name: Waiting for MySQL
          command: |
            for i in `seq 1 15`; do
              nc -z 127.0.0.1 3306 && echo "MySQL ready" && exit 0
              sleep 1
            done
            echo "MySQL not ready" && exit 1

      # Install Composer
      - run:
          name: Install Composer
          command: |
            curl -sS https://getcomposer.org/installer | php
            sudo mv composer.phar /usr/local/bin/composer

      # Install Node + Yarn
      - run:
          name: Install Node.js
          command: |
            curl -sL https://deb.nodesource.com/setup_20.x | sudo bash -
            sudo apt install -y nodejs
            sudo npm install -g yarn

      # Install Playwright
      - run:
          name: Install Playwright browsers
          command: |
            npx playwright install --with-deps

      # Build Webship with the composer.
      - run:
          name: Build Webship with the composer
          command: |
            sudo rm -rf /var/www/html/test -vvv || true
            sudo mkdir -p /var/www/html/test
            sudo chown -R $(id -u):$(id -g) /var/www/html/test

            cd /var/www/html/test
            git clone --branch '11.0.x' https://github.com/webship/webship-project.git webship

            cd webship
            composer install --no-interaction -vvv

            cp web/sites/default/default.settings.php web/sites/default/settings.php

            echo "\$databases['default']['default'] = [
              'database' => 'test_webship',
              'username' => 'root',
              'password' => 'rootpw',
              'host' => '127.0.0.1',
              'port' => '3306',
              'driver' => 'mysql',
            ];" >> web/sites/default/settings.php

      # Apache config
      - run:
          name: Configure Apache
          command: |
            echo "<VirtualHost *:80>
              ServerName webship.test
              DocumentRoot /var/www/html/test/webship/web

              <Directory /var/www/html/test/webship/web>
                AllowOverride All
                Require all granted
              </Directory>
            </VirtualHost>" | sudo tee /etc/apache2/sites-available/webship.conf

            sudo a2ensite webship.conf
            echo "127.0.0.1 webship.test" | sudo tee -a /etc/hosts
            sudo service apache2 restart

      # Install webship with drush.
      - run:
          name: Install webship with drush
          command: |
            mysql -h 127.0.0.1 -uroot -prootpw -e "DROP DATABASE IF EXISTS test_webship;"
            mysql -h 127.0.0.1 -uroot -prootpw -e "CREATE DATABASE test_webship;"

            cd /var/www/html/test/webship/web

            ../bin/drush site-install webship \
              --yes \
              --site-name='Webship' \
              --account-name=admin \
              --account-pass=dD.123123ddd \
              --account-mail=info@webship.co \
              --db-url="mysql://root:rootpw@127.0.0.1/test_webship"

            # 🔥 IMPORTANT: keep for test stability
            ../bin/drush config-set system.performance css.preprocess 0 --yes
            ../bin/drush config-set system.performance js.preprocess 0 --yes
            ../bin/drush config-set system.logging error_level all --yes
            ../bin/drush cr

      # Add testing users
      - run:
          name: Add testing users
          command: |
            cd /var/www/html/test/webship/web/profiles/contrib/webship/scripts
            bash add-testing-users.sh

jobs:
  webship-testing:
    <<: *defaults
    steps:
      - webship-build

      - run:
          name: Run tests (Playwright + Cucumber)
          no_output_timeout: 30m
          command: |
            cd /var/www/html/test/webship/web/profiles/contrib/webship
            yarn install
            yarn test

workflows:
  version: 2
  webship-workflow:
    jobs:
      - webship-testing:
          filters:
            tags:
              only: /^11.0.*/
            branches:
              only: /^11.0.x/