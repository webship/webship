# phpcs:ignoreFile
#
# A curated list of the Webship site templates. The Webship installer lists
# them, in addition to the `Site` recipes in the recipes directory of the
# project. A site template that is already in the recipes directory is used as
# it is; otherwise, the installer requires its package with Composer. The
# canonical URL of this file is:
# https://git.drupalcode.org/api/v4/projects/project%2Fwebship/repository/files/site-templates.yml/raw?ref=12.0.x
#
# Format of this file:
# template_name:
#   name: Human readable name of the template
#   description: A brief description of the template
#   screenshot: (optional) URL to a screenshot of the template
#   package: The name of the package that provides this template
#   links: A list of links related to the template, each with "text" and "url"
#   creator: The name of the site template's creator (or organization)
#
# @see \Drupal\webship\SiteTemplate
# @see \Drupal\webship\Form\SiteTemplateForm::getCuratedList()
#
# To override this list, convert it to a PHP array (`<?php return [...];`) and
# place it in `sites/default/site-templates.php`.
#
webship_starter:
  name: 'Webship Starter'
  description: 'The Webship site template: the Website Starter with documentation, products and releases, a newsletter and social sharing. Built with the UI Suite UIkit theme (UIkit and HTMX) on top of Drupal and Display Builder.'
  screenshot: 'https://git.drupalcode.org/project/webship_starter/-/raw/1.0.x/screenshot.webp?ref_type=heads'
  package: 'drupal/webship_starter'
  links:
    - text: 'Learn more'
      url: 'https://www.drupal.org/project/webship_starter'
  creator: Webship

website_starter:
  name: 'Website Starter'
  description: 'A website built with Display Builder and the UI Suite UIkit design system: page layout, Webpage and Web Blog content displays, contact webform, menus, a UIkit showcase and demo content.'
  screenshot: 'https://git.drupalcode.org/project/website_starter/-/raw/1.0.x/screenshot.webp?ref_type=heads'
  package: 'drupal/website_starter'
  links:
    - text: 'Learn more'
      url: 'https://www.drupal.org/project/website_starter'
  creator: Webship

webship_portal:
  name: 'Webship Portal'
  description: 'The Webship.co portal site template: the Webship Starter with Webtheme, a theme generated from UI Suite UIkit with the Webship.co colors and design.'
  package: 'drupal/webship_portal'
  links:
    - text: 'Learn more'
      url: 'https://www.drupal.org/project/webship_portal'
  creator: Webship
