name: Webship Installer
type: profile
core_version_requirement: '^11.4 || ^12'
description: 'The Webship installer: choose a site template built with recipes, Display Builder and UI Suite UIkit. Not to be used in production.'

# Use the `distribution` key to skip the installer's profile selection step.
distribution:
  name: Webship
  install:
    theme: webship_installer_theme
    # When done, redirect to the dashboards of the Web Dashboard module, from
    # the webdash recipe. It opens the first dashboard the user can view.
    finish_url: 'admin/webdashboard'

# Explicitly provide an empty list of themes -- this prevents the installer from
# injecting Stark into it.
# @see install_profile_info()
themes: []
